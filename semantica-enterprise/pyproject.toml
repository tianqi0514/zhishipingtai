[project]
name = "semantica-enterprise"
version = "0.10.0"
description = "Organization knowledge platform built on Semantica"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pymysql>=1.1,<2",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "minio>=7.2",
  "celery>=5.6,<6",
  "redis>=7.1,<9",
  "PyJWT>=2.10",
  "cryptography>=44",
  "httpx>=0.27,<0.29",
  "openai>=1.60",
  "fastembed>=0.8,<0.9",
  "qdrant-client>=1.19,<2",
  "falkordb>=1.7,<2",
  "gitpython>=3.1,<4",
  "python-pptx>=1.0",
  "pdfplumber>=0.11",
  "pytesseract>=0.3.13",
  "pillow>=12.2",
  "beautifulsoup4>=4.12,<5",
  "ebooklib>=0.19,<1",
  "odfpy>=1.4,<2",
  "striprtf>=0.0.29,<1",
  "extract-msg>=0.55,<1",
  "mutagen>=1.47,<2",
  "python-magic>=0.4.27,<1",
  "pyarrow>=18,<22",
  "pymongo>=4.10,<5",
  "elasticsearch>=8.17,<9",
  "duckdb>=1.2,<2",
  "datasets>=3.2,<5",
  "snowflake-connector-python>=3.13,<5",
  "databricks-sql-connector>=4,<5",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
  "paramiko>=3.5,<5",
  "smbprotocol>=1.15,<2",
  "pika>=1.3,<2",
  "typer>=0.15,<1",
  "mcp>=1.12,<2",
]

[project.scripts]
chuanshen = "apps.cli:app"

[project.optional-dependencies]
m4 = [
  "docling>=2.107",
  "onnxruntime>=1.20,<2",
  "xlrd>=2.0",
]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]
